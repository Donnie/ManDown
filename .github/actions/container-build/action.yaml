name: Build Container
description: Build and optionally push a container with Docker Buildx (GitHub Actions cache)

inputs:
  containerfile:
    description: Path to the Containerfile
    required: true
  image_name:
    description: Image name without registry or tag (e.g. mandown-poller)
    required: true
  tag:
    description: Image tag. If empty, uses the workspace version from Cargo.toml
    required: false
    default: ''
  push:
    description: Whether to push the image to Artifact Registry
    required: false
    default: 'false'
  github_variable:
    description: If set after a push, update this GitHub Actions variable with the image name
    required: false
    default: ''
  repository_uri:
    description: Artifact Registry repository URI (required when push is true)
    required: false
    default: ''
  registry_uri:
    description: Artifact Registry host URI (required when push is true)
    required: false
    default: ''
  gcp_project_id:
    description: GCP project ID (required when push is true)
    required: false
    default: ''
  gcp_wif:
    description: GCP workload identity provider (required when push is true)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve image tag
      id: tag
      shell: bash
      env:
        TAG_INPUT: ${{ inputs.tag }}
        IMAGE_NAME: ${{ inputs.image_name }}
        PUSH: ${{ inputs.push }}
        REPOSITORY_URI: ${{ inputs.repository_uri }}
      run: |
        if [ -n "$TAG_INPUT" ]; then
          tag="$TAG_INPUT"
        else
          tag=$(grep "^version = " Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')
        fi

        if [ "$PUSH" = "true" ]; then
          image="${REPOSITORY_URI}/${IMAGE_NAME}:${tag}"
        else
          image="${IMAGE_NAME}:${tag}"
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google Cloud
      if: inputs.push == 'true'
      uses: google-github-actions/auth@v3
      with:
        create_credentials_file: 'true'
        project_id: ${{ inputs.gcp_project_id }}
        workload_identity_provider: ${{ inputs.gcp_wif }}

    - name: Set up Cloud SDK
      if: inputs.push == 'true'
      uses: google-github-actions/setup-gcloud@v3
      with:
        install_components: gcloud
        project_id: ${{ inputs.gcp_project_id }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Configure Docker for Artifact Registry
      if: inputs.push == 'true'
      shell: bash
      env:
        REGISTRY_URI: ${{ inputs.registry_uri }}
      run: |
        gcloud auth configure-docker "$REGISTRY_URI"

    - name: Build and push container
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.containerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.tag.outputs.image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set image variable
      if: inputs.push == 'true' && inputs.github_variable != ''
      shell: bash
      env:
        IMAGE: ${{ steps.tag.outputs.image }}
        GITHUB_VARIABLE: ${{ inputs.github_variable }}
      run: |
        gh variable set "$GITHUB_VARIABLE" -b "$IMAGE"
