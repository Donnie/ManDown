name: Poller Build and Push

on:
  push:
    branches:
      - v3

env:
  GH_TOKEN: ${{ secrets.MANDOWN_PAT }}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and Push Poller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Find Cargo tag
        run: |
          tag=$(grep "^version = " Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')
          echo "CARGO_TAG=$tag" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: 'true'
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gcloud
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.REGISTRY_URI }}

      - name: Generate tag
        run: |
          TAG=${{ env.CARGO_TAG }}
          FULL_IMAGE_NAME="${{ vars.REPOSITORY_URI }}/mandown-poller:$TAG"
          echo "image_name=$FULL_IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push poller container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/poller/Containerfile
          push: true
          tags: ${{ env.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set prod image variable
        run: |
          gh variable set IMAGE_POLLER -b ${{ env.image_name }}
