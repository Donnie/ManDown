name: PR Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/actions/podman-build/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'config.yaml'
      - 'crates/poller/Containerfile'
      - 'crates/webhook/Containerfile'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check version
      run: cargo version

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Build project
      run: cargo build --workspace --verbose

    - name: Run tests
      run: cargo test --workspace --verbose

  poller-container:
    name: Build Poller Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Build poller container
      uses: ./.github/actions/podman-build
      with:
        containerfile: crates/poller/Containerfile
        image: mandown-poller:ci
        cache_image: ${{ vars.REPOSITORY_URI }}/mandown-poller-buildcache

  webhook-container:
    name: Build Webhook Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Build webhook container
      uses: ./.github/actions/podman-build
      with:
        containerfile: crates/webhook/Containerfile
        image: mandown-webhook:ci
        cache_image: ${{ vars.REPOSITORY_URI }}/mandown-webhook-buildcache

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run security audit
      run: cargo audit
