name: Webhook Build and Push

on:
  push:
    branches:
      - main
    paths:
      - '.containerignore'
      - '.github/actions/podman-build/**'
      - '.github/workflows/webhook-build-push.yaml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'config.yaml'
      - 'crates/core/**'
      - 'crates/webhook/**'

env:
  GH_TOKEN: ${{ secrets.MANDOWN_PAT }}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and Push Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Find Cargo tag
        run: |
          tag=$(grep "^version = " Cargo.toml | head -n 1 | sed 's/version = "\(.*\)"/\1/')
          echo "CARGO_TAG=$tag" >> $GITHUB_ENV

      - name: Build and push webhook container
        uses: ./.github/actions/podman-build
        with:
          containerfile: crates/webhook/Containerfile
          image: ${{ vars.REPOSITORY_URI }}/mandown-webhook:${{ env.CARGO_TAG }}
          cache_image: ${{ vars.REPOSITORY_URI }}/mandown-webhook-buildcache
          push: 'true'
          github_variable: IMAGE_WEBHOOK
